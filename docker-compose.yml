# Docker Compose for Raspberry Pi 4
# Runs OAK-D camera driver + OpenVINS VIO pipeline + data logger
#
# Usage:
#   docker compose up --build                       # run everything (VIO + logging)
#   docker compose up --build openvins              # rebuild only OpenVINS
#   docker compose --profile rviz up --build rviz               # visualise live topics in RViz
#   docker compose --profile sgbm up --build sgbm               # run StereoSGBM point-cloud node
#   docker compose --profile stereo_proc up --build stereo_proc # run stereo_image_proc point-cloud
#
# Logs are written to ./logs/ on the host:
#   logs/bags/<timestamp>/        — ros2 bag (raw sensors + estimated topics)
#   logs/trajectories/<timestamp>.txt — estimated trajectory (TUM format, for ov_eval)
#   logs/timing/<timestamp>.txt   — CPU/memory usage per run

services:

  # ---------------------------------------------------------------
  # OAK-D camera driver
  # Publishes: /oak/left/image_raw, /oak/right/image_raw,
  #            /oak/imu/data, /oak/points
  # ---------------------------------------------------------------
  oak_driver:
    profiles: [openvins]
    build:
      context: .
      dockerfile: Dockerfile_oak_driver
    network_mode: host          # topics are visible to other host-mode containers
    ipc: host                   # share /dev/shm so FastDDS SHM transport works
    privileged: true            # required for USB device access on Pi 4
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - /dev/bus/usb:/dev/bus/usb   # USB device access for OAK-D
      - ./config/oak_d/oak_params.yaml:/config/oak_params.yaml
    restart: unless-stopped

  # ---------------------------------------------------------------
  # OpenVINS VIO pipeline
  # Subscribes: /oak/left/image_raw, /oak/right/image_raw, /oak/imu/data
  # Publishes:  /ov_msckf/odometry     — nav_msgs/Odometry (pose + covariance)
  #             /ov_msckf/pathimu      — trajectory path
  #             /ov_msckf/poseimu      — geometry_msgs/PoseWithCovarianceStamped
  # ---------------------------------------------------------------
  openvins:
    profiles: [openvins]
    build:
      context: .
      dockerfile: ${OPENVINS_DOCKERFILE:-Dockerfile_ros2_22_04}
    network_mode: host
    ipc: host                   # share /dev/shm so FastDDS SHM transport works
    environment:
      - RUN_TIMESTAMP=${RUN_TIMESTAMP:-}   # set externally to pin all services to the same timestamp
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ./logs:/logs
      - ./config/oak_d:/ros2_ws/install/ov_msckf/share/ov_msckf/config/oak_d
    command:
      - ros2
      - launch
      - ov_msckf
      - subscribe.launch.py
      - config:=oak_d
      - use_stereo:=true
      - max_cameras:=2
      - verbosity:=DEBUG
      - recorder_output:=/logs/trajectories/${RUN_TIMESTAMP:-latest}/estimated_trajectory.txt
      - timing_output:=/logs/timing/${RUN_TIMESTAMP:-latest}/psutil_log.txt
    depends_on:
      - oak_driver
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Data logger
  # Records raw sensor streams + estimated topics to a ros2 bag.
  # Bag location: ./logs/bags/<timestamp>/
  #
  # Topics recorded:
  #   Sensors  — /oak/left/image_raw, /oak/right/image_raw, /oak/imu/data
  #              /oak/left/camera_info, /oak/right/camera_info
  #   Estimate — /ov_msckf/odometry, /ov_msckf/poseimu, /ov_msckf/pathimu
  #
  # To replay a bag offline:
  #   ros2 bag play logs/bags/<timestamp>/bag
  # ---------------------------------------------------------------
  logger:
    profiles: [openvins]
    image: ros:humble-ros-base
    network_mode: host
    ipc: host                   # share /dev/shm so FastDDS SHM transport works
    environment:
      - RUN_TIMESTAMP=${RUN_TIMESTAMP:-}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    command:
      - bash
      - -c
      - |
        source /opt/ros/humble/setup.bash
        TS=$${RUN_TIMESTAMP:-$$(date +%Y%m%d_%H%M%S)}
        BAG_DIR=/logs/bags/$$TS
        mkdir -p $$BAG_DIR
        echo "Logging to $$BAG_DIR — waiting 5s for topics to appear..."
        sleep 5
        exec ros2 bag record \
          /oak/left/image_raw \
          /oak/right/image_raw \
          /oak/imu/data \
          /oak/left/camera_info \
          /oak/right/camera_info \
          /ov_msckf/odometry \
          /ov_msckf/poseimu \
          /ov_msckf/pathimu \
          -o $$BAG_DIR/bag
    volumes:
      - ./logs:/logs
    depends_on:
      - oak_driver
      - openvins
    restart: unless-stopped


  # ---------------------------------------------------------------
  # BasaltVIO(opt-in, conflicts with oak_driver)
  # Uses on-device BasaltVIO via the depthai Python API.
  # Do NOT run alongside oak_driver — both own the USB device.
  #
  # Publishes:
  #   /odom    nav_msgs/Odometry
  #   /points  sensor_msgs/PointCloud2
  #
  # Start with:
  #   docker compose --profile basalt up --build basalt
  # ---------------------------------------------------------------
  basalt:
    profiles: [basalt]
    build:
      context: .
      dockerfile: Dockerfile_basalt
    network_mode: host
    ipc: host
    privileged: true            # required for USB device access
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - SCRIPT=${BASALT_SCRIPT:-/scripts/vio_pointcloud.py}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./scripts:/scripts
    restart: unless-stopped


  # ---------------------------------------------------------------
  # Hesai FTX LiDAR driver (opt-in)
  # Publishes: /lidar_points  — sensor_msgs/PointCloud2
  # The FTX sends raw UDP packets on port 2368; PTC control on port 9347.
  # host networking lets the driver reach the physical NIC directly.
  #
  # Start with:
  #   docker compose --profile ftx up --build hesai_driver
  #
  # To use a custom sensor config mount it over the default:
  #   volumes:
  #     - ./config/ftx/config.yaml:/ros2_ws/src/hesai_ros_driver/config/config.yaml
  # ---------------------------------------------------------------
  hesai_driver:
    profiles: [ftx]
    build:
      context: .
      dockerfile: Dockerfile_ftx_driver
    image: open_vins_mt_yannic-ftx_driver:latest
    network_mode: host          # lets driver reach physical NIC for UDP/PTC traffic
    ipc: host                   # share /dev/shm for FastDDS SHM transport
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ./config/ftx/config.yaml:/ros2_ws/src/hesai_ros_driver/config/config.yaml:ro
    restart: unless-stopped


  # ---------------------------------------------------------------
  # RViz visualiser (opt-in, not started by default)
  # Connects to the running stack via host network + shared DDS.
  #
  # Prerequisites on host:
  #   xhost +local:docker    # allow X11 from container
  #
  # Start with:
  #   docker compose --profile rviz up --build rviz
  # ---------------------------------------------------------------
  rviz:
    profiles: [rviz]
    build:
      context: .
      dockerfile: Dockerfile_rviz
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./config/rviz/openvins.rviz:/config/openvins.rviz
    devices:
      - /dev/dri:/dev/dri

  # RViz — point cloud view (depth_camera_optical_frame)
  # Start with: docker compose --profile basalt_rviz_points up basalt_rviz_points
  basalt_rviz_points:
    profiles: [basalt_rviz_points]
    build:
      context: .
      dockerfile: Dockerfile_rviz
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./config/rviz/basalt_vio.rviz:/config/basalt_vio.rviz
    devices:
      - /dev/dri:/dev/dri
    command: ["ros2", "run", "rviz2", "rviz2", "-d", "/config/basalt_vio.rviz"]

  # RViz — odometry view (odom frame)
  # Start with: docker compose --profile basalt_rviz_odom up basalt_rviz_odom
  basalt_rviz_odom:
    profiles: [basalt_rviz_odom]
    build:
      context: .
      dockerfile: Dockerfile_rviz
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./config/rviz/basalt_odom.rviz:/config/basalt_odom.rviz
    devices:
      - /dev/dri:/dev/dri
    command: ["ros2", "run", "rviz2", "rviz2", "-d", "/config/basalt_odom.rviz"]

 