# Docker Compose for Raspberry Pi 4
# Runs OAK-D camera driver + OpenVINS VIO pipeline + data logger
#
# Usage:
#   docker compose up --build                       # run everything (VIO + logging)
#   docker compose up --build openvins              # rebuild only OpenVINS
#   docker compose --profile rviz up --build rviz               # visualise live topics in RViz
#   docker compose --profile sgbm up --build sgbm               # run StereoSGBM point-cloud node
#   docker compose --profile stereo_proc up --build stereo_proc # run stereo_image_proc point-cloud
#
# Logs are written to ./logs/ on the host:
#   logs/bags/<timestamp>/        — ros2 bag (raw sensors + estimated topics)
#   logs/trajectories/<timestamp>.txt — estimated trajectory (TUM format, for ov_eval)
#   logs/timing/<timestamp>.txt   — CPU/memory usage per run

services:

  # ---------------------------------------------------------------
  # OAK-D camera driver
  # Publishes: /oak/left/image_raw, /oak/right/image_raw,
  #            /oak/imu/data, /oak/points
  # ---------------------------------------------------------------
  oak_driver:
    build:
      context: .
      dockerfile: Dockerfile_oak_driver
    network_mode: host          # topics are visible to other host-mode containers
    ipc: host                   # share /dev/shm so FastDDS SHM transport works
    privileged: true            # required for USB device access on Pi 4
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - /dev/bus/usb:/dev/bus/usb   # USB device access for OAK-D
      - ./config/oak_d/oak_params.yaml:/config/oak_params.yaml
    restart: unless-stopped

  # ---------------------------------------------------------------
  # OpenVINS VIO pipeline
  # Subscribes: /oak/left/image_raw, /oak/right/image_raw, /oak/imu/data
  # Publishes:  /ov_msckf/odometry     — nav_msgs/Odometry (pose + covariance)
  #             /ov_msckf/pathimu      — trajectory path
  #             /ov_msckf/poseimu      — geometry_msgs/PoseWithCovarianceStamped
  # ---------------------------------------------------------------
  openvins:
    build:
      context: .
      dockerfile: ${OPENVINS_DOCKERFILE:-Dockerfile_ros2_22_04}
    network_mode: host
    ipc: host                   # share /dev/shm so FastDDS SHM transport works
    environment:
      - RUN_TIMESTAMP=${RUN_TIMESTAMP:-}   # set externally to pin all services to the same timestamp
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ./logs:/logs
      - ./config/oak_d:/ros2_ws/install/ov_msckf/share/ov_msckf/config/oak_d
    command:
      - ros2
      - launch
      - ov_msckf
      - subscribe.launch.py
      - config:=oak_d
      - use_stereo:=true
      - max_cameras:=2
      - verbosity:=ALL
      - recorder_output:=/logs/trajectories/${RUN_TIMESTAMP:-latest}/estimated_trajectory.txt
      - timing_output:=/logs/timing/${RUN_TIMESTAMP:-latest}/psutil_log.txt
    depends_on:
      - oak_driver
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Data logger
  # Records raw sensor streams + estimated topics to a ros2 bag.
  # Bag location: ./logs/bags/<timestamp>/
  #
  # Topics recorded:
  #   Sensors  — /oak/left/image_raw, /oak/right/image_raw, /oak/imu/data
  #              /oak/left/camera_info, /oak/right/camera_info
  #   Estimate — /ov_msckf/odometry, /ov_msckf/poseimu, /ov_msckf/pathimu
  #
  # To replay a bag offline:
  #   ros2 bag play logs/bags/<timestamp>/bag
  # ---------------------------------------------------------------
  logger:
    image: ros:humble-ros-base
    network_mode: host
    ipc: host                   # share /dev/shm so FastDDS SHM transport works
    environment:
      - RUN_TIMESTAMP=${RUN_TIMESTAMP:-}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    command:
      - bash
      - -c
      - |
        source /opt/ros/humble/setup.bash
        TS=$${RUN_TIMESTAMP:-$$(date +%Y%m%d_%H%M%S)}
        BAG_DIR=/logs/bags/$$TS
        mkdir -p $$BAG_DIR
        echo "Logging to $$BAG_DIR — waiting 5s for topics to appear..."
        sleep 5
        exec ros2 bag record \
          /oak/left/image_raw \
          /oak/right/image_raw \
          /oak/imu/data \
          /oak/left/camera_info \
          /oak/right/camera_info \
          /ov_msckf/odometry \
          /ov_msckf/poseimu \
          /ov_msckf/pathimu \
          -o $$BAG_DIR/bag
    volumes:
      - ./logs:/logs
    depends_on:
      - oak_driver
      - openvins
    restart: unless-stopped

  # ---------------------------------------------------------------
  # RViz visualiser (opt-in, not started by default)
  # Connects to the running stack via host network + shared DDS.
  #
  # Prerequisites on host:
  #   xhost +local:docker    # allow X11 from container
  #
  # Start with:
  #   docker compose --profile rviz up --build rviz
  # ---------------------------------------------------------------
  rviz:
    profiles: [rviz]
    build:
      context: .
      dockerfile: Dockerfile_rviz
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./config/rviz/openvins.rviz:/config/openvins.rviz
    devices:
      - /dev/dri:/dev/dri

 