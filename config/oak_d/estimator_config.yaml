%YAML:1.0 # need to specify the file type at the top!

# OpenVINS config for OAK-D stereo + IMU
# Algorithm parameters aligned with boxi_alphasense_stim320.
# Oak-D specific values: camera topics, resolution, intrinsics — see kalibr_imucam_chain.yaml
#                        IMU topic, noise — see kalibr_imu_chain.yaml

verbosity: "INFO" # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

use_fej: true # if first-estimate Jacobians should be used (enable for good consistency)
integration: "analytical" # discrete, rk4, analytical (if rk4 or analytical used then analytical covariance propagation is used)
use_stereo: true # if we have more than 1 camera, if we should try to track stereo constraints between pairs
max_cameras: 2 # how many cameras we have 1 = mono, 2 = stereo, >2 = binocular (all mono tracking)

calib_cam_extrinsics: false # if the transform between camera and IMU should be optimized R_ItoC, p_CinI
calib_cam_intrinsics: true # if camera intrinsics should be optimized (focal, center, distortion)
calib_cam_timeoffset: true # if timeoffset between camera and IMU should be optimized
calib_imu_intrinsics: false # if imu intrinsics should be calibrated (rotation and skew-scale matrix)
calib_imu_g_sensitivity: false # if gyroscope gravity sensitivity (Tg) should be calibrated

max_clones: 11 # how many clones (poses of IMU) in the sliding window
max_slam: 50 # number of features in our state vector
max_slam_in_update: 25 # update can be split into sequential updates of batches, how many in a batch
max_msckf_in_update: 40 # how many MSCKF features to use in the update
dt_slam_delay: 2 # delay before initializing (helps with stability from bad initialization...)

gravity_mag: 9.81 # magnitude of gravity in this location

feat_rep_msckf: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# zero velocity update parameters we can use
# we support either IMU-based or disparity detection.
try_zupt: true # true means zero motion residual added when robot judged stationary (can turn on for slow robots)
zupt_chi2_multipler: 3 # set to 0 for only disp-based
zupt_max_velocity: 1 # max velocity where the zero velocity check is not auto-rejected
zupt_noise_multiplier: 2
zupt_max_disparity: 3 # set to 0 for only imu-based
zupt_only_at_beginning: false

# ==================================================================
# ==================================================================

init_window_time: 1.0 # how many seconds to collect initialization information
init_imu_thresh: 1.5 # if set to 0 force to use dynamic initialization; threshold for variance of the accelerometer to detect a "jerk" in motion
init_max_disparity: 10.0 # max disparity to consider the platform stationary; if calculated disparity is above this fall back to static initialization (dependent on resolution)
init_max_features: 450 # how many features to track during initialization (saves on computation)

init_dyn_use: false # if dynamic initialization should be used
init_dyn_mle_opt_calib: false # if we should optimize calibration during initialization (not recommended)
init_dyn_mle_max_iter: 50 # how many iterations the MLE refinement should use (zero to skip the MLE)
init_dyn_mle_max_time: 0.1 # how many seconds the MLE should be completed in
init_dyn_mle_max_threads: 4 # how many threads the MLE should use (Pi 4 has 4 cores)
init_dyn_num_pose: 4 # number of poses to use within our window time (evenly spaced)
init_dyn_min_deg: 10.0 # orientation change needed to try to init

init_dyn_inflation_ori: 10 # what to inflate the recovered q_GtoI covariance by
init_dyn_inflation_vel: 100 # what to inflate the recovered v_IinG covariance by
init_dyn_inflation_bg: 10 # what to inflate the recovered bias_g covariance by
init_dyn_inflation_ba: 100 # what to inflate the recovered bias_a covariance by
init_dyn_min_rec_cond: 1e-12 # reciprocal condition number thresh for info inversion

init_dyn_bias_g: [ 0.0, 0.0, 0.0 ] # initial gyroscope bias guess
init_dyn_bias_a: [ -1.50, 0.0, 0.0 ] # initial accelerometer bias guess — BNO086 hardware x-axis offset

# ==================================================================
# ==================================================================

record_timing_information: true # if we want to record timing information of the method
record_timing_filepath: "/logs/ov_timing.txt" # https://docs.openvins.com/eval-timing.html#eval-ov-timing-flame

# if we want to save the state and its diagonal covariance
# use this with rosrun ov_eval error_simulation
save_total_state: true
filepath_est: "/logs/ov_estimate.txt"
filepath_std: "/logs/ov_estimate_std.txt"
filepath_gt: "/logs/ov_groundtruth.txt"

# ==================================================================
# ==================================================================

# our front-end feature tracking parameters
# we have a KLT and descriptor based (KLT is better implemented...)
use_klt: true # if true we will use KLT, otherwise use a ORB descriptor + robust matching
num_pts: 200 # number of points (per camera) — reduced from 450 for Pi 4 performance
fast_threshold: 10 # threshold for fast extraction — raised to reduce candidate count
grid_x: 5 # extraction sub-grid count for horizontal direction (uniform tracking)
grid_y: 5 # extraction sub-grid count for vertical direction (uniform tracking)
min_px_dist: 10 # distance between features (features near each other provide less information)
knn_ratio: 0.70 # descriptor knn threshold for the top two descriptor matches (not used if KLT; if lower means that reject more matches)
track_frequency: 5.01 # fps of the images which will be used by the system — matches oak_params.yaml i_fps: 5.0
downsample_cameras: true # halves image to 320x200 for KLT — ~4x faster tracking; intrinsics adjusted automatically
num_opencv_threads: 4 # use all Pi 4 cores for KLT optical flow
histogram_method: "HISTOGRAM" # CLAHE is expensive; HISTOGRAM is faster with similar contrast benefit

# aruco tag tracker for the system
# DICT_6X6_1000 from https://chev.me/arucogen/
use_aruco: false
num_aruco: 1024
downsize_aruco: true

# ==================================================================
# ==================================================================

# camera noises and chi-squared threshold multipliers
up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 5
up_slam_sigma_px: 1
up_slam_chi2_multipler: 5
up_aruco_sigma_px: 1 # not present if not using aruco
up_aruco_chi2_multipler: 1 # not present if not using aruco

# masks for our images
# No mask used for OAK-D — full 640x400 FOV is unobstructed
use_mask: false

# imu and camera spatial-temporal
# imu config should also have the correct noise values
relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
